name: Frontend Quality

on:
  push:
    branches: [main, master, codex/**]
  pull_request:
  # 允许 deploy.yml 通过 `uses: ./.github/workflows/quality.yml` 复用这套检查，
  # 保证质量门禁只有一份定义，生产部署必须等它通过。
  workflow_call:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm format:check
      - name: Run ESLint
        run: pnpm lint
      - name: Check i18n keys
        run: pnpm check:i18n
      # 计划模块的结构自检 + SSR 冒烟：漏导入、漏监听、样式归属拆错这类问题
      # 构建和 lint 都不报，只有 SSR 渲染时的 Vue 警告能抓到。
      - name: Check plan module
        run: pnpm check:plan-module
      - name: Run tests
        run: pnpm test
      # ⚠️ 临时诊断步骤（定位完即删）：把失败用例通过 annotation 暴露出来。
      # 本仓库的 job 日志需要管理员权限才能通过 API 读取，annotation 可以。
      - name: Diagnose test failure
        if: failure()
        run: |
          set +e
          pnpm test > /tmp/t.txt 2>&1
          {
            echo "failing subtests:"
            grep -E "^not ok" /tmp/t.txt | head -20
            echo ""
            echo "detail:"
            grep -E "^ +(error|code|expected|actual|operator):|AssertionError|Cannot find|SyntaxError|TypeError|ReferenceError|Error:" /tmp/t.txt | head -40
            echo ""
            echo "tail:"
            tail -30 /tmp/t.txt
          } > /tmp/msg.txt
          body=$(sed ':a;N;$!ba;s/\n/%0A/g' /tmp/msg.txt)
          echo "::error title=CI test failure::$body"
      - name: Build client
        run: pnpm build:client
      # 必须在 build 之后：该检查直接核对 dist 产物里的 CSS，用来发现"组件在、样式没了"
      # 这类回归（lint / i18n / SSR 冒烟都发现不了），同时反向确认没有退化成全量引入。
      - name: Check Element Plus on-demand styles
        run: pnpm --filter heal-view-client check:element-styles
