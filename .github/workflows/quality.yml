name: Frontend Quality

on:
  push:
    branches: [main, master, codex/**]
  pull_request:
  # 允许 deploy.yml 通过 `uses: ./.github/workflows/quality.yml` 复用这套检查，
  # 保证质量门禁只有一份定义，生产部署必须等它通过。
  workflow_call:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm format:check
      - name: Run ESLint
        run: pnpm lint
      - name: Check i18n keys
        run: pnpm check:i18n
      - name: Run tests
        run: pnpm test
      - name: Build client
        run: pnpm build:client
