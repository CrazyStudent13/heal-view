name: Build and Deploy

# 只有 master 的推送才触发生产部署。
# 也支持手动触发：留空 image_tag 会重新构建并部署当前 ref；填入历史 commit SHA
# 则跳过构建、直接部署那个已存在的镜像，用于回滚。
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      image_tag:
        description: '要部署的镜像标签。留空 = 重建并部署；填历史 commit SHA = 回滚到该版本。'
        required: false
        type: string
        default: ''

# 生产部署绝不并发执行，也绝不允许取消进行中的部署，
# 否则容器可能停在「已拉取新镜像但未完成切换」的半更新状态。
concurrency:
  group: heal-view-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  # 复用 quality.yml 的格式化 / ESLint / i18n / 测试 / 构建检查。
  # 回滚场景（指定了 image_tag）不跑检查：回滚要快，而且此时 master 的代码
  # 可能正处于出问题的状态，跑检查反而会挡住回滚。
  quality:
    if: ${{ !inputs.image_tag }}
    uses: ./.github/workflows/quality.yml

  deploy:
    needs: [quality]
    # quality 被跳过（回滚）或成功都继续；只要它失败或取消就停止。
    if: ${{ always() && needs.quality.result != 'failure' && needs.quality.result != 'cancelled' }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 缺少 Secrets 时必须显式失败。
      # 旧版本用 `if: env.DEPLOY_HOST != ''` 静默跳过部署，会让人误以为已经发布成功。
      - name: Check required secrets
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          missing=""
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_PATH GHCR_TOKEN; do
            if [ -z "${!name:-}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::缺少必需的 Secrets:$missing （Settings → Environments → production → Environment secrets。注意：配成仓库级 Secret 这里读不到）"
            exit 1
          fi
          echo "Secrets 检查通过。"

      - name: Resolve image name and tag
        id: image
        shell: bash
        run: |
          # GHCR 要求镜像名全小写，而 github.repository 会保留用户名的大小写。
          name="$(echo '${{ env.REGISTRY }}/${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "name=$name" >> "$GITHUB_OUTPUT"

          if [ -n "${{ inputs.image_tag }}" ]; then
            # 手动回滚：部署指定标签，不重新构建。
            tag='${{ inputs.image_tag }}'
            build=false
          elif [ "${{ github.event_name }}" = "push" ]; then
            # 正常发布：用不可变的 commit SHA 作为标签，便于追溯与回滚。
            tag='${{ github.sha }}'
            build=true
          else
            # 手动触发不填标签：重建并部署 latest。
            tag='latest'
            build=true
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "将部署：$name:$tag（构建镜像：$build）"

      - name: Set up Buildx
        if: steps.image.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.image.outputs.build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        if: steps.image.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push image to GHCR
        if: steps.image.outputs.build == 'true'
        shell: bash
        run: |
          docker push '${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}'
          docker push '${{ steps.image.outputs.name }}:latest'

      - name: Save image archive for SSH transfer
        if: steps.image.outputs.build == 'true'
        id: archive
        shell: bash
        run: |
          archive="$RUNNER_TEMP/heal-view-image.tar.gz"
          docker save '${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}' | gzip -1 > "$archive"
          echo "path=$archive" >> "$GITHUB_OUTPUT"
          du -h "$archive"

      # 中国大陆服务器访问 GHCR 可能很慢。优先通过已经可用的 SSH 链路传输镜像，
      # 远端直接 docker load；传输失败时由后面的部署脚本回退到 GHCR pull。
      - name: Transfer image archive to server
        if: steps.image.outputs.build == 'true'
        continue-on-error: true
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT != '' && secrets.DEPLOY_PORT || '22' }}
          source: ${{ steps.archive.outputs.path }}
          target: /tmp
          overwrite: true
          command_timeout: 45m

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          IMAGE_REF: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          IMAGE_ARCHIVE: /tmp/heal-view-image.tar.gz
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT != '' && secrets.DEPLOY_PORT || '22' }}
          envs: DEPLOY_PATH,IMAGE_REF,GHCR_USERNAME,GHCR_TOKEN,IMAGE_ARCHIVE
          script_stop: true
          # 首次部署或服务器缓存为空时，GHCR 镜像可能需要下载数百 MB。
          # 15 分钟在低带宽 VPS 上不足，会在 docker compose pull 仍进行时被 SSH action 强制终止。
          command_timeout: 45m
          script: |
            set -eu

            : "${DEPLOY_PATH:?DEPLOY_PATH 未配置}"
            : "${IMAGE_REF:?IMAGE_REF 未配置}"
            : "${GHCR_USERNAME:?GHCR_USERNAME 未配置}"
            : "${GHCR_TOKEN:?GHCR_TOKEN 未配置}"

            if [ ! -d "$DEPLOY_PATH/.git" ]; then
              echo "ERROR: $DEPLOY_PATH 不是 git 仓库。请先在服务器上执行一次 deploy/setup-server.sh。" >&2
              exit 1
            fi

            cd "$DEPLOY_PATH"

            # 同步 compose 文件到最新 master。
            # deploy/.env、deploy/data、deploy/uploads 都被 .gitignore 忽略，
            # 因此强制对齐 master 不会动到配置和数据库。
            #
            # 这一步刻意做成「失败不阻断」：真正要部署的镜像来自 ghcr.io，
            # 而部分地区的服务器访问 github.com 会被间歇性干扰。若因网络问题
            # 拿不到最新 compose 文件，就沿用服务器上现成的那份继续部署，
            # 只发警告，不让一次网络抖动把整个发布搞失败。
            echo "==> 同步 compose 文件到最新 master"
            fetch_status=0
            # 显式捕获 git 的退出码。这样即使远端返回 curl 28/128，
            # set -e 也不会在可选的 compose 同步步骤中终止整个部署。
            git -c http.lowSpeedLimit=0 -c http.lowSpeedTime=0 fetch --prune origin master || fetch_status=$?
            if [ "$fetch_status" -ne 0 ]; then
              echo "WARNING: 无法从 GitHub 同步仓库，沿用服务器上现有的 compose 文件继续部署。" >&2
            elif git checkout -f -B master origin/master; then
              echo "compose 文件已同步。"
            else
              echo "WARNING: 无法切换到最新 master，沿用服务器上现有的 compose 文件继续部署。" >&2
            fi

            if [ ! -f deploy/.env ]; then
              echo "==> 首次部署：由模板生成 deploy/.env"
              cp deploy/.env.example deploy/.env
            fi

            echo "==> 固定镜像版本：$IMAGE_REF"
            if grep -q '^HEAL_VIEW_IMAGE=' deploy/.env; then
              sed -i "s#^HEAL_VIEW_IMAGE=.*#HEAL_VIEW_IMAGE=$IMAGE_REF#" deploy/.env
            else
              echo "HEAL_VIEW_IMAGE=$IMAGE_REF" >> deploy/.env
            fi

            image_loaded=false
            if [ -n "${IMAGE_ARCHIVE:-}" ] && [ -f "$IMAGE_ARCHIVE" ]; then
              echo "==> 通过 SSH 传输的镜像包加载镜像"
              if gzip -dc "$IMAGE_ARCHIVE" | docker load; then
                image_loaded=true
                rm -f "$IMAGE_ARCHIVE"
                echo "镜像包加载完成，跳过 GHCR 拉取。"
              else
                echo "WARNING: 镜像包加载失败，回退到 GHCR 拉取。" >&2
              fi
            fi

            if [ "$image_loaded" != true ]; then
              echo "==> 登录 GHCR"
              printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
              echo "==> 拉取镜像"
              pull_ok=false
              for attempt in 1 2 3; do
                if docker compose --env-file deploy/.env pull heal-view; then
                  pull_ok=true
                  break
                fi
                if [ "$attempt" -lt 3 ]; then
                  echo "WARNING: 镜像拉取失败，将在 10 秒后重试（第 $attempt/3 次）。" >&2
                  sleep 10
                fi
              done
              if [ "$pull_ok" != true ]; then
                echo "ERROR: 镜像拉取失败，已重试 3 次。" >&2
                exit 1
              fi
            fi

            echo "==> 启动容器"
            docker compose --env-file deploy/.env up -d --remove-orphans heal-view

            cid="$(docker compose --env-file deploy/.env ps -q heal-view)"
            if [ -z "$cid" ]; then
              echo "ERROR: 容器没有启动。" >&2
              docker compose --env-file deploy/.env logs --tail=120 heal-view || true
              exit 1
            fi

            echo "==> 等待健康检查通过"
            status="starting"
            i=0
            while [ "$i" -lt 40 ]; do
              status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$cid" 2>/dev/null || echo unknown)"
              if [ "$status" = "healthy" ] || [ "$status" = "unhealthy" ] || [ "$status" = "exited" ]; then
                break
              fi
              i=$((i + 1))
              sleep 3
            done

            docker compose --env-file deploy/.env ps

            if [ "$status" != "healthy" ]; then
              echo "ERROR: 健康检查未通过（当前状态：$status）。" >&2
              echo "提示：数据卷位于 deploy/data，未被本次部署改动，可以回滚镜像版本。" >&2
              docker compose --env-file deploy/.env logs --tail=150 heal-view || true
              exit 1
            fi

            echo "==> 清理悬空镜像"
            docker image prune -f

            echo "==> 部署完成：$IMAGE_REF"
